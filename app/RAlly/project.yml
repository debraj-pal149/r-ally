name: RAlly
options:
  bundleIdPrefix: com.rally
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.5"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  Mixpanel:
    url: https://github.com/mixpanel/mixpanel-swift
    from: 7.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.15.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  RAlly:
    type: application
    platform: iOS
    sources:
      - path: RAlly
        excludes:
          - Info.plist
          - RAlly.entitlements
          - GoogleService-Info.plist
      - path: RAlly/GoogleService-Info.plist
        buildPhase: resources
        optional: true
      - path: RAlly/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rally.RAlly
        PRODUCT_NAME: RAlly
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RAlly/Info.plist
        CODE_SIGN_ENTITLEMENTS: RAlly/RAlly.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "5LV8BN8Q4Q"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          MIXPANEL_TOKEN: $(MIXPANEL_DEV_TOKEN)
        Release:
          MIXPANEL_TOKEN: $(MIXPANEL_PROD_TOKEN)
    dependencies:
      - package: Mixpanel
        product: Mixpanel
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: RAlly/Info.plist
      properties:
        CFBundleDisplayName: R·ALLY
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: r-ally uses GPS to measure your pace and distance so it can shout at the right moment.
        NSMotionUsageDescription: r-ally uses motion and cadence to tell when your form starts to fade.
        NSBluetoothAlwaysUsageDescription: r-ally reads live heart rate from a Bluetooth strap or a watch in broadcast mode.
        NSBluetoothPeripheralUsageDescription: r-ally connects to heart-rate straps so encouragement can use live effort.
        NSHealthShareUsageDescription: r-ally reads heart rate and past workouts (including Nike Run Club runs synced to Apple Health) to understand your effort.
        NSHealthUpdateUsageDescription: r-ally saves completed workouts to Apple Health.
        UIBackgroundModes:
          - audio
          - location
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
        FISH_AUDIO_API_KEY: $(FISH_AUDIO_API_KEY)
        ELEVENLABS_API_KEY: $(ELEVENLABS_API_KEY)
        STRAVA_CLIENT_ID: $(STRAVA_CLIENT_ID)
        STRAVA_OAUTH_PROXY_URL: $(STRAVA_OAUTH_PROXY_URL)
        MIXPANEL_TOKEN: $(MIXPANEL_TOKEN)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - rally
            CFBundleURLName: com.rally.RAlly
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.78490070871-euhiq54217po6lorgceq6q8dpcg7pmjn
            CFBundleURLName: GoogleSignIn
    entitlements:
      path: RAlly/RAlly.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin:
          - Default
    preBuildScripts:
      - name: Generate secrets
        basedOnDependencyAnalysis: false
        script: |
          ROOT="${SRCROOT}/../.."
          /bin/bash "${ROOT}/scripts/gen-secrets.sh"
  RAllyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RAllyTests
    dependencies:
      - target: RAlly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rally.RAllyTests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_NAME: RAllyTests
        PRODUCT_MODULE_NAME: RAllyTests
schemes:
  RAlly:
    build:
      targets:
        RAlly: all
        RAllyTests: [test]
    test:
      targets:
        - RAllyTests
